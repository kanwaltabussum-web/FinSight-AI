<div
    class="upload-box"
    id="uploadBox"
>

    <div class="upload-icon">
        ↑
    </div>

    <h3>
        Upload financial records
    </h3>

    <p>
        Select the record type and upload your
        financial file for analysis.
    </p>


    <!-- =================================
         FINANCIAL RECORD TYPE
    ================================== -->

    <label
        for="dataType"
        style="
            display:block;
            margin:20px auto 8px;
            max-width:360px;
            text-align:left;
            font-size:13px;
            font-weight:600;
            color:#10243e;
        "
    >
        Financial record type
    </label>


    <select
        id="dataType"
        style="
            display:block;
            width:100%;
            max-width:360px;
            margin:0 auto;
            padding:12px 14px;
            border:1px solid #d9e0e8;
            border-radius:10px;
            background:#ffffff;
            color:#10243e;
            font-size:14px;
            font-family:inherit;
            outline:none;
            cursor:pointer;
            box-sizing:border-box;
        "
    >

        <option value="bank_statement">
            Bank Statement
        </option>

        <option value="general_ledger">
            General Ledger (GL)
        </option>

        <option value="cash_book">
            Cash Book
        </option>

    </select>


    <!-- =================================
         FILE UPLOAD
    ================================== -->

    <p style="margin-top:18px;">

        Drag & drop your CSV or Excel file here

        <br>

        or choose a file from your computer.

    </p>


    <input
        type="file"
        id="fileInput"
        accept=".csv,.xlsx,.xls"
        hidden
    >


    <button
        class="upload-button"
        onclick="document.getElementById('fileInput').click()"
    >
        Choose File
    </button>


    <div class="file-info">

        Supported formats:
        CSV, XLSX, XLS

    </div>

</div>
