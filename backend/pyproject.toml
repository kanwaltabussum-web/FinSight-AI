[project]
name = "finsight-ai"
version = "1.0.0"
description = "FinSight AI financial intelligence application"
requires-python = "==3.12.*"

dependencies = [
        "fastapi[standard]",
    "uvicorn",
    "pandas",
    "openpyxl",
    "python-multipart",
    "xlrd>=2.0.1",
    "pypdf>=4.2.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23"
]

[tool.fastapi]
entrypoint = "main:app"